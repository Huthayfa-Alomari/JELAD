name: JELAD Mobile CI

on:
  push:
    paths:
      - 'mobile/**'
  pull_request:
    paths:
      - 'mobile/**'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze shared core
        working-directory: mobile/packages/jelad_core
        run: flutter pub get && dart analyze
      - name: Analyze customer
        working-directory: mobile/customer
        run: flutter pub get && dart analyze
      - name: Analyze driver
        working-directory: mobile/driver
        run: flutter pub get && dart analyze

  android-build:
    needs: analyze
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [customer, driver]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        working-directory: mobile/\${{ matrix.app }}
        run: flutter create --platforms=android .
      - name: Build Android debug APK
        working-directory: mobile/\${{ matrix.app }}
        run: flutter pub get && flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jelad-\${{ matrix.app }}-android-debug
          path: mobile/\${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk

  ios-build:
    needs: analyze
    runs-on: macos-latest
    strategy:
      matrix:
        app: [customer, driver]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS platform
        working-directory: mobile/\${{ matrix.app }}
        run: flutter create --platforms=ios .
      - name: Validate iOS build
        working-directory: mobile/\${{ matrix.app }}
        run: flutter pub get && flutter build ios --no-codesign
